<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <rect width="800" height="320" fill="#F6F5F1"/>
  <!-- Subtle Light Architectural Blueprint Grid -->
  <g stroke="#111111" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="280" y1="0" x2="280" y2="320"/>
    <line x1="440" y1="0" x2="440" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
  </g>
  <!-- Ceiling Line -->
  <line x1="80" y1="45" x2="620" y2="45" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Ceiling Canopy Rose -->
  <rect x="310" y="45" width="80" height="18" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <!-- Suspension Micro-cables -->
  <line x1="170" y1="45" x2="170" y2="195" stroke="#8C6D46" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="530" y1="45" x2="530" y2="195" stroke="#8C6D46" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- Height Dimension Callout -->
  <line x1="95" y1="45" x2="95" y2="215" stroke="#444444" stroke-width="1"/>
  <line x1="88" y1="45" x2="102" y2="45" stroke="#444444" stroke-width="1"/>
  <line x1="88" y1="215" x2="102" y2="215" stroke="#444444" stroke-width="1"/>
  <text x="82" y="135" fill="#111111" font-family="monospace" font-size="11" text-anchor="end">MAX 2400 mm</text>
  <!-- Linear Luminaire Extrusion Body -->
  <rect x="120" y="195" width="460" height="24" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <!-- Glowing Diffuser Line -->
  <line x1="124" y1="219" x2="576" y2="219" stroke="#C59B6D" stroke-width="3.5"/>
  <!-- Length Dimension Callout -->
  <line x1="120" y1="255" x2="580" y2="255" stroke="#444444" stroke-width="1"/>
  <line x1="120" y1="247" x2="120" y2="263" stroke="#444444" stroke-width="1"/>
  <line x1="580" y1="247" x2="580" y2="263" stroke="#444444" stroke-width="1"/>
  <text x="350" y="274" fill="#111111" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">L = 1200 mm</text>
  <!-- Cross-Section Detail on Right -->
  <rect x="665" y="175" width="44" height="52" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <line x1="668" y1="227" x2="706" y2="227" stroke="#C59B6D" stroke-width="3.5"/>
  <text x="687" y="162" fill="#666666" font-family="monospace" font-size="10" text-anchor="middle">SECTION A-A</text>
  <text x="687" y="250" fill="#111111" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">W: 35 × H: 40 mm</text>
</svg>
